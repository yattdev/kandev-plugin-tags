# kandev-plugin-tags manifest -- the declarative contract between this plugin
# and a kandev host. See PLUGIN-API.md / docs/public/plugins-authoring.md in
# the kandev monorepo for the full schema.
id: "kandev-plugin-tags"
api_version: 1
version: "0.7.0"
display_name: "Tags"
description: "Add one or more colored tags to a kanban card, stored privately per user, shown as chips on the card, the sidebar task row, and the /tasks list row, with a redesigned top-bar Tags box (icon-lg trigger, aligned rows, palette/hex color picker with explicit Update/Cancel) combining filter and manage (once the host supports it) or a manage-only fallback on older hosts."
author: "yattdev"
repo_url: "https://github.com/yattdev/kandev-plugin-tags"
categories: ["tools"]

# runtime.executables maps each supported platform to the binary kandev
# spawns as a gRPC subprocess. `make package` cross-compiles all five;
# `make package-host` builds just the current one. This plugin's backend is a
# backend serves workspace-shared agent status tags; user tags continue to
# live privately in the frontend UI bundle against host.storage.
runtime:
  type: binary
  executables:
    linux-amd64: "server/plugin-linux-amd64"
    linux-arm64: "server/plugin-linux-arm64"
    darwin-amd64: "server/plugin-darwin-amd64"
    darwin-arm64: "server/plugin-darwin-arm64"
    windows-amd64: "server/plugin-windows-amd64.exe"

# user_state enables the authenticated, per-user Host storage API
# (host.storage.get/set/delete/list/subscribe, scope "task") that this
# plugin uses to store each user's own tags on a card, privately.
capabilities:
  user_state: true
  state: true

actions:
  - key: "agent-tags"
    scope: "workspace"
    max_body_bytes: 1024
  - key: "agent-tag-remove"
    scope: "task"
    max_body_bytes: 1024

agent_tools:
  - name: add_tag
    description: Add or update a shared status tag on the current task.
    surfaces: [kanban-task]
    input_schema:
      type: object
      additionalProperties: false
      required: [tag]
      properties:
        tag:
          type: string
          enum: [blocked, needs-input, needs-review, failed, obsolete, abandoned]
        note:
          type: string
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: true
  - name: remove_tag
    description: Remove a shared status tag from the current task.
    surfaces: [kanban-task]
    input_schema:
      type: object
      additionalProperties: false
      required: [tag]
      properties:
        tag:
          type: string
          enum: [blocked, needs-input, needs-review, failed, obsolete, abandoned]
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: true
  - name: list_tags
    description: List shared agent status tags on the current task.
    surfaces: [kanban-task]
    input_schema:
      type: object
      additionalProperties: false
    annotations:
      read_only_hint: true
      destructive_hint: false
      idempotent_hint: true

# ui.bundle points at the hand-written, no-build ES module frontend half:
# a task-card-tags chip row (kanban card) and a task-row-tags chip row
# (sidebar task row / /tasks list row -- smaller chips, capped at 3 plus a
# "+N" indicator, no per-chip remove control), an "Add tag..." kanban menu
# action (with a tag icon) opening a host.ui-built picker modal
# (create-or-select, scrollable pill list), and a "main-top-bar" Tags box
# behind an icon-lg filter-icon trigger: a 380px, grid-aligned tag list
# (a fixed-width delete column regardless of tag name length) with a
# swatch-button color picker -- palette/hex swatches, a live preview, and
# explicit Update/Cancel commit buttons, so a color never applies until you
# choose to commit it. The Tags box's filter/manage behavior depends on
# what the host supports (detectHostCapabilities in ui/bundle.js):
#   - host predates registerTaskFilter: manage-only (rename/recolor/delete;
#     no filtering is possible on this host at all).
#   - host has registerTaskFilter but not host.taskFilters/listByKey: the
#     built-in display/filter dropdown keeps its own "Tags" section, and
#     this dropdown stays manage-only so the two don't duplicate one
#     control.
#   - host has registerTaskFilter + host.taskFilters + host.storage.listByKey:
#     this dropdown becomes the filter *and* the manager in one place
#     (checkbox rows, inline rename, delete with an exact "used by N cards"
#     count and cascade removal) -- the built-in dropdown's section is
#     hidden so there is exactly one Tags control.
ui:
  bundle: "/ui/bundle.js"
