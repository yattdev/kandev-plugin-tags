# kandev-plugin-tags manifest -- the declarative contract between this plugin
# and a kandev host. See PLUGIN-API.md / docs/public/plugins-authoring.md in
# the kandev monorepo for the full schema.
id: "kandev-plugin-tags"
api_version: 1
version: "0.16.2"
display_name: "Tags"
description: "Create and apply workspace-shared colored tags from the board or an agent. Humans manage every shared tag; agents manage only agent-created tags, which display a bot marker when applied. A tag created without a color gets one derived from its name, which the plugin's settings can turn off. On compatible hosts, the Tags box uses a single-select board filter (All, one tag, or Untagged) and contributes page-local Tag Sort/Group options to /tasks; older hosts retain management and the existing filter fallback. On compatible hosts, the Create Task dialog also gets a Tags button to tag a task as it is created."
author: "yattdev"
repo_url: "https://github.com/yattdev/kandev-plugin-tags"
categories: ["tools"]

# runtime.executables maps each supported platform to the binary kandev
# spawns as a gRPC subprocess. `make package` cross-compiles all five;
# `make package-host` builds just the current one. This plugin's backend serves
# the workspace-shared tag catalog and its task applications.
runtime:
  type: binary
  executables:
    linux-amd64: "server/plugin-linux-amd64"
    linux-arm64: "server/plugin-linux-arm64"
    darwin-amd64: "server/plugin-darwin-amd64"
    darwin-arm64: "server/plugin-darwin-arm64"
    windows-amd64: "server/plugin-windows-amd64.exe"

# Operator-editable settings, rendered by kandev at Settings > Plugins > Tags
# and read by the plugin with Host.GetConfig (ungated). The backend serves only
# saved values -- it does not seed a schema default -- so the plugin resolves an
# absent key itself (tagColorAutoEnabled in server/agent_tags.go, default on).
# The web settings form DOES seed the control from `default`
# (apps/web/lib/plugins/config-schema.ts buildInitialValues: an unset boolean
# falls back to the property's default, else false), so `default: true` here is
# what makes an untouched Switch read as on instead of showing an off toggle
# while the plugin derives colors anyway.
config_schema:
  type: object
  properties:
    auto_color:
      type: boolean
      title: "Generate a color for new tags"
      description: >-
        On: a tag created without an explicit color gets the color derived from
        its name, so every tag of a given name starts the same color (renames
        keep it). Off: a new tag starts in the neutral gray and its color is
        picked in the Tags box. Existing
        tags are never recolored by this setting. The plugin's backend applies
        this; on a host old enough to predate plugin actions the browser half
        creates tags instead and cannot read this setting, so such a host always
        derives a color.
      default: true

# user_state remains enabled to render a user's pre-0.8 legacy tags without
# data loss. New tags use the workspace state/actions declared below.
capabilities:
  user_state: true
  state: true

actions:
  - key: "shared-tags"
    scope: "workspace"
    max_body_bytes: 4096
  - key: "tag-create"
    scope: "workspace"
    max_body_bytes: 1024
  - key: "tag-update"
    scope: "workspace"
    max_body_bytes: 1024
  - key: "tag-delete"
    scope: "workspace"
    max_body_bytes: 1024
  - key: "task-tag-add"
    scope: "task"
    max_body_bytes: 1024
  - key: "task-tag-remove"
    scope: "task"
    max_body_bytes: 1024

agent_tools:
  - name: create_tag
    description: Create an agent-owned tag in the shared workspace catalog.
    surfaces: [kanban-task]
    input_schema:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          maxLength: 22
        color:
          type: string
          pattern: "^#[0-9a-fA-F]{3}([0-9a-fA-F]{3})?$"
          description: >-
            Hex color, exactly #rgb or #rrggbb (no surrounding whitespace).
            Omit it to get the color derived from the tag name -- the same
            deterministic color a person creating that name from the board gets
            -- unless the operator turned name-derived colors off, in which case
            an omitted color means the neutral gray.
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: false
  - name: update_tag
    description: Rename or recolor an agent-created shared tag.
    surfaces: [kanban-task]
    input_schema:
      type: object
      additionalProperties: false
      required: [tag_id]
      properties:
        tag_id:
          type: string
        name:
          type: string
          maxLength: 22
          description: >-
            New name for the tag. Omit the field to leave the name as it is; an
            explicitly empty value is refused, because an agent that sends one
            means to change something.
        color:
          type: string
          pattern: "^#[0-9a-fA-F]{3}([0-9a-fA-F]{3})?$"
          description: >-
            New hex color for the tag, exactly #rgb or #rrggbb. Omit the field
            to leave the color as it is; an explicitly empty value is refused,
            because an agent that sends one means to change something.
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: true
  - name: delete_tag
    description: Delete an agent-created tag and remove it from every task.
    surfaces: [kanban-task]
    input_schema:
      type: object
      additionalProperties: false
      required: [tag_id]
      properties:
        tag_id:
          type: string
    annotations:
      read_only_hint: false
      destructive_hint: true
      idempotent_hint: true
  - name: add_tag
    description: >-
      Add or update an agent-created tag on a task in this workspace. Acts on
      the calling agent's own task unless task_id names another one.
    surfaces: [kanban-task]
    input_schema:
      type: object
      additionalProperties: false
      required: [tag_id]
      properties:
        tag_id:
          type: string
        task_id:
          type: string
          description: >-
            Task to act on. Defaults to the calling agent's own task. Must be a
            task in this workspace; tags are stored per workspace, so an id from
            another workspace can never be reached.
        note:
          type: string
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: true
  - name: remove_tag
    description: >-
      Remove this agent's application of an agent-created tag from a task in
      this workspace. Acts on the calling agent's own task unless task_id names
      another one. A human's application of the same tag is left intact.
    surfaces: [kanban-task]
    input_schema:
      type: object
      additionalProperties: false
      required: [tag_id]
      properties:
        tag_id:
          type: string
        task_id:
          type: string
          description: >-
            Task to act on. Defaults to the calling agent's own task. Must be a
            task in this workspace; tags are stored per workspace, so an id from
            another workspace can never be reached.
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: true
  - name: list_tags
    description: >-
      List the shared catalog and the tags applied to a task in this workspace.
      Reports the calling agent's own task unless task_id names another one.
    surfaces: [kanban-task]
    input_schema:
      type: object
      additionalProperties: false
      properties:
        task_id:
          type: string
          description: >-
            Task to act on. Defaults to the calling agent's own task. Must be a
            task in this workspace; tags are stored per workspace, so an id from
            another workspace can never be reached.
    annotations:
      read_only_hint: true
      destructive_hint: false
      idempotent_hint: true

# ui.bundle points at the hand-written, no-build ES module frontend half:
# a task-card-tags chip row (kanban card) and a task-row-metadata chip row
# (sidebar task row / /tasks list row -- smaller chips, capped at 3 plus a
# "+N" indicator, no per-chip remove control), an "Add tag..." kanban menu
# action (with a tag icon) opening a host.ui-built picker modal
# (create-or-select, scrollable pill list), and a "main-top-bar" Tags box
# behind an icon-lg filter-icon trigger: a 380px, grid-aligned tag list
# (a fixed-width delete column regardless of tag name length) with a
# swatch-button color picker -- palette/hex swatches, a live preview, and
# explicit Update/Cancel commit buttons, so a color never applies until you
# choose to commit it. New tags created without a color store the one derived
# from their name (autoTagColor in server/agent_tags.go, mirrored by
# colorFromName in ui/bundle.js for hosts that predate plugin actions) unless
# the operator turns that off with the auto_color setting above. The Tags
# box's filter/manage behavior depends on what the host supports
# (detectHostCapabilities in ui/bundle.js):
#   - host predates registerTaskFilter: manage-only (rename/recolor/delete;
#     no filtering is possible on this host at all).
#   - host has registerTaskFilter but not host.taskFilters/listByKey: the
#     built-in display/filter dropdown keeps its own "Tags" section, and
#     this dropdown stays manage-only so the two don't duplicate one
#     control.
#   - host has registerTaskFilter + host.taskFilters + host.storage.listByKey:
#     this dropdown becomes the filter *and* the manager in one place
#     (a labeled single-select with All tags, one colored tag, or Untagged;
#     inline rename; delete with an exact "used by N cards"
#     count and cascade removal) -- the built-in dropdown's section is
#     hidden so there is exactly one Tags control.
#   - host also has registerTaskListFacet: the plugin contributes Tag Sort and
#     Group choices to /tasks. Those choices are client-side over the current
#     loaded page; they never expose private tag storage to backend queries.
ui:
  bundle: "/ui/bundle.js"
